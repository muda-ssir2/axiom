{% extends "base.html" %}

{% block title %}Page Not Found (404) – AXIOMPATH{% endblock %}

{% block content %}
<div class="container py-5 my-md-5 text-center">
    <div class="glass-card p-5 max-w-600 mx-auto">
        <div class="display-1 fw-extrabold text-cyan mb-2">404</div>
        <h3 class="text-white fw-bold mb-2">Destination Off Course</h3>
        <p class="text-muted small mb-4">
            The page or placement resource you are looking for has been moved, renamed, or does not exist on our servers.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-cyan">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            <a href="{{ url_for('jobs.index') }}" class="btn btn-outline-cyan">
                Explore Jobs
            </a>
        </div>
    </div>
</div>
{% endblock %}
