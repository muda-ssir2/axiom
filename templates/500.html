{% extends "base.html" %}

{% block title %}Internal Server Error (500) – AXIOMPATH{% endblock %}

{% block content %}
<div class="container py-5 my-md-5 text-center">
    <div class="glass-card p-5 max-w-600 mx-auto">
        <div class="display-1 fw-extrabold text-danger mb-2">500</div>
        <h3 class="text-white fw-bold mb-2">Internal Server Error</h3>
        <p class="text-muted small mb-4">
            An unexpected error occurred while processing your request. Our engineering team has been alerted.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-cyan">
            <i class="fa-solid fa-house me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
